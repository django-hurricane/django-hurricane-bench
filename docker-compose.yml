services:
  postgres:
    image: postgres:17-alpine
    container_name: bench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-benchdb}
      POSTGRES_USER: ${DB_USER:-benchuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-benchpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-benchuser} -d ${DB_NAME:-benchdb}"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 3s

  fake-api:
    build:
      context: ./services/fake-api
    container_name: bench-fake-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 3s

  django-asgi-sync:
    build:
      context: .
      args:
        HURRICANE_VERSION: ${HURRICANE_VERSION:-2.0.0rc2}
    container_name: bench-django-asgi-sync
    profiles: ["asgi-sync", "all"]
    environment:
      - FORCE_SYNC_VIEWS=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-benchdb}
      - DB_USER=${DB_USER:-benchuser}
      - DB_PASSWORD=${DB_PASSWORD:-benchpass}
      - FAKE_API_URL=http://fake-api:8080
      - DJANGO_SETTINGS_MODULE=config.settings
    command: ["python", "manage.py", "serve", "--port", "8000", "--probe-port", "8000", "--workers", "1"]
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      fake-api:
        condition: service_healthy

  django-asgi:
    build:
      context: .
      args:
        HURRICANE_VERSION: ${HURRICANE_VERSION:-2.0.0rc2}
    container_name: bench-django-asgi
    profiles: ["asgi", "all"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-benchdb}
      - DB_USER=${DB_USER:-benchuser}
      - DB_PASSWORD=${DB_PASSWORD:-benchpass}
      - FAKE_API_URL=http://fake-api:8080
      - DJANGO_SETTINGS_MODULE=config.settings
    command: ["python", "manage.py", "serve", "--port", "8000", "--probe-port", "8000", "--workers", "1"]
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      fake-api:
        condition: service_healthy

  django-asgi-auto:
    build:
      context: .
      args:
        HURRICANE_VERSION: ${HURRICANE_VERSION:-2.0.0rc2}
    container_name: bench-django-asgi-auto
    profiles: ["asgi-auto", "all"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-benchdb}
      - DB_USER=${DB_USER:-benchuser}
      - DB_PASSWORD=${DB_PASSWORD:-benchpass}
      - FAKE_API_URL=http://fake-api:8080
      - DJANGO_SETTINGS_MODULE=config.settings
    command: ["python", "manage.py", "serve", "--port", "8000", "--probe-port", "8000"]
    ports:
      - "8006:8000"
    depends_on:
      postgres:
        condition: service_healthy
      fake-api:
        condition: service_healthy

  django-asgi-async:
    build:
      context: .
      args:
        HURRICANE_VERSION: ${HURRICANE_VERSION:-2.0.0rc2}
    container_name: bench-django-asgi-async
    profiles: ["asgi-async", "all"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-benchdb}
      - DB_USER=${DB_USER:-benchuser}
      - DB_PASSWORD=${DB_PASSWORD:-benchpass}
      - FAKE_API_URL=http://fake-api:8080
      - DJANGO_SETTINGS_MODULE=config.settings_async
    command: ["python", "manage.py", "serve", "--port", "8000", "--probe-port", "8000", "--workers", "1"]
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      fake-api:
        condition: service_healthy

  locust:
    build:
      context: ./benchmark
    container_name: bench-locust
    profiles: ["bench"]
    environment:
      - TARGET_HOST=${TARGET_HOST:-http://django-asgi:8000}
    volumes:
      - ./benchmark:/locust
      - ./reports:/reports
    depends_on:
      postgres:
        condition: service_healthy
      fake-api:
        condition: service_healthy

volumes:
  postgres_data:
